<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <script src="js/main.js" defer></script>
    <title>Rock Paper Scissors</title>
</head>
<body>
    <section class="overlay">
        <div class="choice">
            <p>What's your choice?</p>
            <div class="div_btn">
                <button class="btn" id="rock_btn">Rock</button>
                <button class="btn" id="paper_btn">Paper</button>
                <button class="btn" id="scissor_btn">Scissor</button>
            </div>
        </div>
        <div class="displey_choice">
            <p id="humanChoice">
                Human choice: 
            </p>
            <p id="computerChoice">
                Computer choice:
            </p>
        </div>
        <div class="whos_win">
            <p>WIN: </p>
        </div>
        <div class="score">
            <p id="human_score">Human score:</p>
            <p id="computer_score">Computer score:</p>
        </div>
    </section>
</body>
</html>
