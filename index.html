<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <script src="js/main.js" defer></script>
    <title>Rock Paper Scissors</title>
</head>
<body>
    <section class="overlay">
        <div class="name">
            <p><span style="color: brown;">R</span>ock <span style="color: brown;">P</span>aper <span style="color: brown;">S</span>cissors</p>
        </div>
        <div class="options">
            <p>What's your choice?</p>
            <div>
                <button class="btn" id="rock_btn">Rock</button>
                <button class="btn" id="paper_btn">Paper</button>
                <button class="btn" id="scissors_btn">Scissors</button>
            </div>
        </div>

        <div class="displey_choice">
            <p id="humanChoice">
                Human choice: 
                <span id="humanLog"></span>
            </p>
            <p id="computerChoice">
                Computer choice: 
                <span id="computerLog"></span>
            </p>
        </div>

        <div class="score">
            <p id="human_score">
                Human score:
                <span id="humanSLog"></span>
            </p>
            <p id="computer_score">
                Computer score:
                <span id="computerSLog"></span>
            </p>
        </div>
        
        <div class="whos_win">
            <p>WIN: <span id="winner"></span></p>
        </div>
        
    </section>
</div>
</body>
</html>
